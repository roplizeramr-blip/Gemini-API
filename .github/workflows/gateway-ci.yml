name: Gateway CI

on:
  push:
    branches: ["master"]
  pull_request:

jobs:
  validate-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[gateway,dev]"
      - name: Compile
        run: python -m compileall -q src gateway cli.py
      - name: Ruff
        run: ruff check gateway
      - name: Import gateway
        run: python -c "from gateway.main import app; print(app.title)"
      - name: Build Docker image
        run: docker build --tag gemini-gateway-ci .
